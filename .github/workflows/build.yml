name: Test and make .unitypackage
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Setup .NET 8.x
      uses: actions/setup-dotnet@v4
      with:
        # Semantic version range syntax or exact version of a dotnet version
        dotnet-version: '8.x'
    - name: Checkout
      uses: actions/checkout@v4
    - name: Build
      run: dotnet build --configuration Release
    - name: Test
      run: TestCilbox/bin/Release/net8.0/TestCilbox
    - name: Test CPU execution budgets
      run: dotnet run --project TestCilboxCpuBudget/TestCilboxCpuBudget.csproj --configuration Release
    - name: Test native clock qualification retry policy
      run: |
        cc -std=c11 -O2 -Wall -Wextra -Werror TestCilboxCpuBudget/native_qualification_policy_tests.c -o "$RUNNER_TEMP/cilbox-clock-policy-tests"
        "$RUNNER_TEMP/cilbox-clock-policy-tests"
    - name: "Produce cilbox unitypackage."
      timeout-minutes: 5
      run:
        .github/scripts/unitypackagegen.sh
    - uses: actions/upload-artifact@v4
      timeout-minutes: 5
      with:
        name: unitypackage_upload
        path: |
          com.cnlohr.cilbox.unitypackage

  windows-cpu-budgets:
    runs-on: windows-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
        - sdk: '8.x'
          framework: net8.0
        - sdk: '10.x'
          framework: net10.0
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ matrix.sdk }}
    - name: Restore CPU budget tests
      run: dotnet restore TestCilboxCpuBudget/TestCilboxCpuBudget.csproj -p:TargetFramework=${{ matrix.framework }}
    - name: Build CPU budget tests
      run: dotnet build TestCilboxCpuBudget/TestCilboxCpuBudget.csproj --configuration Release -p:TargetFramework=${{ matrix.framework }} --no-restore
    - name: Test Windows thread CPU clock and execution budgets
      run: dotnet TestCilboxCpuBudget/bin/Release/${{ matrix.framework }}/TestCilboxCpuBudget.dll


